
services:
  ai-generator:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_text_to_image_app
    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      PYTHONUNBUFFERED: "1"
      FLASK_PORT: "5000"
      FLASK_ENV: "production"

    volumes:
      - ./static/generated:/app/static/generated
      - hf_cache:/root/.cache/huggingface

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - t2i-network

volumes:
  hf_cache:
    driver: local

networks:
  t2i-network:
    driver: bridge
